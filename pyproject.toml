[project]
name = "asr-lab"
version = "0.1.0"
description = "Multilingual ASR evaluation and data-centric optimization lab"
readme = "README.md"
authors = [
    { name = "Ivan Namor", email = "namorivan@gmail.com" }
]
requires-python = ">=3.11"
dependencies = [
    "faster-whisper>=1.2.1",
    "huggingface-hub>=2.3.0",
    "num2words>=0.5.14",
    "numpy>=2.4.6",
    "pyarrow>=21",
    "scikit-learn>=1.6",
    "soundfile>=0.14.0",
    "soxr>=1.1.0",
    "tqdm>=4.70.1",
]

[project.scripts]
asr-lab = "asr_lab.cli:main"

[project.optional-dependencies]
tracking = [
    "mlflow>=3.17.2",
]
plots = [
    "matplotlib>=3.9",
]
# Models run with Hugging Face Transformers: wav2vec2 CTC and Parakeet TDT (experiment E1b);
# a GPU in practice, not installed by the CI. Parakeet needs Transformers 5.6 and librosa.
hf = [
    "librosa>=0.10",
    "torch>=2.4",
    "transformers>=5.6",
]
# Fine-tuning (experiment E7), on a GPU; not installed by the CI
training = [
    "asr-lab[hf]",
    "peft>=0.13",
]
lm = [
    "kenlm>=0.3.0",
]

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "jiwer>=4.0.0",
    "pre-commit>=4.7.0",
    "pytest>=9.1.1",
    "ruff>=0.17.2",
]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",  # pycodestyle: basic style errors and warnings
    "F",       # pyflakes: unused imports/variables, undefined names
    "I",       # isort: import ordering
    "B",       # flake8-bugbear: likely bugs (e.g. mutable default arguments)
    "UP",      # pyupgrade: use modern syntax for the target Python version
    "SIM",     # flake8-simplify: simpler equivalent code
    "PTH",     # flake8-use-pathlib: pathlib instead of os.path (cross-platform rule)
    "NPY",     # numpy-specific rules (deprecated APIs, legacy random)
    "RUF",     # ruff-specific rules
]

[tool.ruff.format]
docstring-code-format = true

[tool.pytest.ini_options]
testpaths = ["tests", "src", "README.md"]
addopts = [
    "-ra",
    "--strict-markers",
    "--import-mode=importlib",
    "--doctest-modules",
    "--doctest-glob=README.md",
    "-m",
    "not slow",
]
markers = ["slow: downloads models or needs local datasets; run with `pytest -m slow`"]
